services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slotkeeper}
      POSTGRES_USER: ${POSTGRES_USER:-slotkeeper}
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD:-slotkeeper}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slotkeeper}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
